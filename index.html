<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ece1c9" />
    <!-- Paint the aged-paper background immediately, before app CSS/JS arrive.
         A small dot-matrix "O" pulses in the center as the boot mark. -->
    <style>
      html,
      body {
        margin: 0;
        background: #ece1c9;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #ece1c9;
      }
      #boot svg {
        width: 44px;
        height: 44px;
        animation: bootpulse 1.5s ease-in-out infinite;
      }
      @keyframes bootpulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg {
          animation: none;
        }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-source.png" />
    <title>Operator · Mission control for working agents</title>
    <meta
      name="description"
      content="Operator is a macOS desktop app for orchestrating Claude Code. Define agents and per-task models, watch a live orchestration timeline of every tool call and subagent, run agents in isolated git worktrees, review diffs in-app, and track usage and cost — all from one mission-control window."
    />
    <meta name="author" content="juanmnl" />
    <meta name="robots" content="index, follow" />
    <meta
      name="keywords"
      content="Claude Code, agent orchestration, macOS app, Tauri, AI agents, git worktrees, orchestration timeline, token cost dashboard, developer tools, subagents"
    />
    <link rel="canonical" href="https://juanmnl.com/operator-app/" />
